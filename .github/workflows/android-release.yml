name: Android Release Build & Sign

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_note:
        description: 'Optional build note / description'
        required: false
        default: 'Manual Release Build'

jobs:
  build:
    name: Build & Sign Release Bundle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: ⚙️ Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: 🛡️ Pre-Flight Test Gate
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 📦 Build Release AAB (Google Play) & APK
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: 🔑 Sign Release AAB (Google Play Bundle)
        id: sign_aab
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 🔑 Sign Release APK (Direct Install)
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 📤 Upload Build Artifacts (Actions Dashboard)
        uses: actions/upload-artifact@v4
        with:
          name: shellguard-totp-release-builds
          path: |
            ${{ steps.sign_aab.outputs.signedReleaseFile }}
            ${{ steps.sign_apk.outputs.signedReleaseFile }}
          retention-days: 14

      - name: 🚀 Publish GitHub Release (Tag Trigger Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ShellGuard-TOTP Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.sign_aab.outputs.signedReleaseFile }}
            ${{ steps.sign_apk.outputs.signedReleaseFile }}
